@media (prefers-color-scheme: dark) {

    --fg: #e9ebee;
    --muted: #a9afb6;
    --line: #262a31;

*, *::before, *::after { box-sizing: border-box; }
html {

body { margin: 0; background: var(--bg); color: var(--fg); overflow-wrap: break-word; }

}
.brand { font-weight: 700; font-size: 1.1rem; color: var(--fg); text-decoration: none; }
.site-nav a { margin-right: 1rem; }

p, ul, ol { margin: 0.6rem 0; }
ul, ol { padding-left: 1.25rem; }
li { margin: 0.35rem 0; }
a { color: var(--accent); text-underline-offset: 0.15em; }

a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0.75rem 1rem; margin: 1rem 0; }
.card p:first-child, .card h2:first-child { margin-top: 0; }
.urgent { border-left: 4px solid var(--accent); }
.help li { margin: 0.6rem 0; }
.site-footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.95rem; }
